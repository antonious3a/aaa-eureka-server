x-common: &common
  image:
  networks:
    - aaa-bridge
  restart: always
  deploy:
    resources:
      limits:
        memory: 1G
  healthcheck:
    test: "curl -fsk http://localhost/actuator/health/readinessState | grep UP || exit 1"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

x-common-env: &common-env
  SERVER_PORT: 80
  EUREKA_ENVIRONMENT: development
  EUREKA_CLIENT_FETCH-REGISTRY: true
  EUREKA_CLIENT_REGISTER-WITH-EUREKA: true

services:
  eureka-1:
    <<: *common
    container_name: aaa-eureka-1
    hostname: eureka1.antonio3a.aaa
    environment:
      <<: *common-env
      eureka.client.service-url.defaultZone: http://eureka2.antonio3a.aaa/eureka/, http://eureka3.antonio3a.aaa/eureka/
    ports:
      - "80:8761"

  eureka-2:
    <<: *common
    container_name: aaa-eureka-2
    hostname: eureka2.antonio3a.aaa
    environment:
      <<: *common-env
      eureka.client.service-url.defaultZone: http://eureka1.antonio3a.aaa/eureka/, http://eureka3.antonio3a.aaa/eureka/
    ports:
      - "80:8762"

  eureka-3:
    <<: *common
    container_name: aaa-eureka-3
    hostname: eureka3.antonio3a.aaa
    environment:
      <<: *common-env
      eureka.client.service-url.defaultZone: http://eureka1.antonio3a.aaa/eureka/, http://eureka2.antonio3a.aaa/eureka/
    ports:
      - "80:8763"

networks:
  aaa-bridge:
    external: true
